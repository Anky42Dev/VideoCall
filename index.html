<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Простой видеозвонок один на один на WebRTC" />
    <meta name="theme-color" content="#080b12" />
    <title>Face to Face — видеозвонок</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="app.js" defer></script>
  </head>
  <body>
    <main class="app">
      <header class="topbar">
        <a class="brand" href="#" aria-label="Face to Face — на главную">
          <span class="brand-mark" aria-hidden="true">
            <span></span><span></span>
          </span>
          <span>Face to Face</span>
        </a>

        <div class="connection-pill" aria-live="polite">
          <span class="status-dot" id="statusDot"></span>
          <span id="connectionStatus">Подключаемся…</span>
        </div>
      </header>

      <section class="call" aria-label="Видеозвонок">
        <div class="ambient ambient-one"></div>
        <div class="ambient ambient-two"></div>

        <div class="stage">
          <div class="remote-card">
            <video id="remoteVideo" autoplay playsinline></video>

            <div class="waiting" id="waitingPanel">
              <div class="waiting-visual" aria-hidden="true">
                <span class="orbit orbit-one"></span>
                <span class="orbit orbit-two"></span>
                <span class="person-icon">
                  <svg viewBox="0 0 24 24" fill="none">
                    <path d="M12 12.6a4.3 4.3 0 1 0 0-8.6 4.3 4.3 0 0 0 0 8.6ZM4.5 21c.5-4 3.3-6.4 7.5-6.4s7 2.4 7.5 6.4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
                  </svg>
                </span>
              </div>
              <p class="eyebrow">Комната готова</p>
              <h1 id="waitingTitle">Ждём собеседника</h1>
              <p id="waitingText">Откройте эту страницу во втором окне или отправьте ссылку собеседнику.</p>
              <button class="copy-button" id="copyLinkButton" type="button">
                <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                  <path d="M9.5 14.5 14.5 9M7.2 16.8l-1.1 1.1a3.4 3.4 0 0 1-4.8-4.8l3.2-3.2a3.4 3.4 0 0 1 4.8 0M16.8 7.2l1.1-1.1a3.4 3.4 0 0 1 4.8 4.8l-3.2 3.2a3.4 3.4 0 0 1-4.8 0" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
                </svg>
                <span>Скопировать ссылку</span>
              </button>
            </div>

            <div class="participant-label remote-label" id="remoteLabel" hidden>
              <span class="live-dot"></span>
              Собеседник
            </div>
          </div>

          <div class="local-card" id="localCard">
            <video id="localVideo" autoplay playsinline muted></video>
            <div class="camera-off" id="cameraOff" hidden>
              <span>Вы</span>
            </div>
            <div class="participant-label">Вы</div>
          </div>
        </div>

        <div class="controls" aria-label="Управление звонком">
          <button class="control-button" id="micButton" type="button" aria-label="Выключить микрофон" aria-pressed="false">
            <svg class="icon-on" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <rect x="8.5" y="3" width="7" height="12" rx="3.5" stroke="currentColor" stroke-width="1.8"/>
              <path d="M5.5 11.5a6.5 6.5 0 0 0 13 0M12 18v3M9 21h6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
            </svg>
            <svg class="icon-off" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M8.5 9v2.5A3.5 3.5 0 0 0 14.7 14M15.5 9.8V6.5a3.5 3.5 0 0 0-6.8-1.2M5.5 11.5a6.5 6.5 0 0 0 10.9 4.8M18.5 11.5a6.5 6.5 0 0 1-.3 2M12 18v3M9 21h6M3 3l18 18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
            </svg>
          </button>

          <button class="control-button" id="cameraButton" type="button" aria-label="Выключить камеру" aria-pressed="false">
            <svg class="icon-on" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <rect x="3" y="6" width="13" height="12" rx="2.5" stroke="currentColor" stroke-width="1.8"/>
              <path d="m16 10 4.2-2.1a.55.55 0 0 1 .8.5v7.2a.55.55 0 0 1-.8.5L16 14" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
            </svg>
            <svg class="icon-off" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M10 6h3.5A2.5 2.5 0 0 1 16 8.5V10l4.2-2.1a.55.55 0 0 1 .8.5v7.2a.55.55 0 0 1-.8.5L17 14.5M16 16.2a2.5 2.5 0 0 1-2.2 1.8H5.5A2.5 2.5 0 0 1 3 15.5v-7A2.5 2.5 0 0 1 4.5 6.2M3 3l18 18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>

          <button class="control-button end-button" id="hangupButton" type="button" aria-label="Завершить звонок">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M4.2 15.5c-.8-.4-1.2-1.3-.8-2.1 1.4-3.1 4.6-5 8.6-5s7.2 1.9 8.6 5c.4.8 0 1.7-.8 2.1l-2.2 1.1c-.7.3-1.5 0-1.8-.6l-.7-1.6c-.2-.5-.7-.8-1.2-.9a11 11 0 0 0-3.8 0c-.5.1-1 .4-1.2.9L8.2 16c-.3.7-1.1 1-1.8.6l-2.2-1.1Z" fill="currentColor"/>
            </svg>
          </button>
        </div>

        <p class="privacy-note">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <rect x="5" y="10" width="14" height="10" rx="2" stroke="currentColor" stroke-width="1.6"/>
            <path d="M8 10V7a4 4 0 0 1 8 0v3" stroke="currentColor" stroke-width="1.6"/>
          </svg>
          Видео передаётся напрямую между участниками
        </p>
      </section>
    </main>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </body>
</html>
